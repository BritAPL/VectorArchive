# Zensical configuration of the Vector archive. Generated by vector-rescue: see README.md.
[project]
site_name = "Vector archive"
site_description = "Rescued articles from Vector, the journal of the British APL Association"
site_url = "https://veced.github.io/VectorArchive/"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
extra_css = ["assets/stylesheets/vector.css?v=9d267849"]
extra_javascript = ["assets/javascripts/mathjax.js?v=d492dfd7", "assets/mathjax-3.2.2/tex-svg.js"]
# Home, the full index and the volumes; the pipeline replaces this line with one entry per volume
nav = [
  { "Home" = "index.md" },
  { "Project status" = "status/index.md" },
  { "Full index" = "full-index/index.md" },
  { "Tags" = "tags/index.md" },
  { "Volumes" = [
    { "Volume 1, 1984–1985" = "1/index.md" },
    { "Volume 2, 1985–1986" = "2/index.md" },
    { "Volume 3, 1986–1987" = "3/index.md" },
    { "Volume 4, 1987–1988" = "4/index.md" },
    { "Volume 5, 1988–1989" = "5/index.md" },
    { "Volume 6, 1989–1990" = "6/index.md" },
    { "Volume 7, 1990–1991" = "7/index.md" },
    { "Volume 8, 1991–1992" = "8/index.md" },
    { "Volume 9, 1992–1993" = "9/index.md" },
    { "Volume 10, 1993–1994" = "10/index.md" },
    { "Volume 11, 1994–1995" = "11/index.md" },
    { "Volume 12, 1995–1996" = "12/index.md" },
    { "Volume 13, 1996–1997" = "13/index.md" },
    { "Volume 14, 1997–1998" = "14/index.md" },
    { "Volume 15, 1998–1999" = "15/index.md" },
    { "Volume 16, 1999–2000" = "16/index.md" },
    { "Volume 17, 2000–2001" = "17/index.md" },
    { "Volume 18, 2001–2002" = "18/index.md" },
    { "Volume 19, 2002–2003" = "19/index.md" },
    { "Volume 20, 2003–2004" = "20/index.md" },
    { "Volume 21, 2004–2005" = "21/index.md" },
    { "Volume 22, 2005–2006" = "22/index.md" },
    { "Volume 23, 2008" = "23/index.md" },
    { "Volume 24, 2008–2010" = "24/index.md" },
    { "Volume 25, 2011–2012" = "25/index.md" },
    { "Volume 26, 2013–2016" = "26/index.md" },
    { "Volume 27, 2016–2022" = "27/index.md" },
  ] },
  { "Comparison with the archive" = "archive-review/index.md" },
]

[project.extra]
# The development build is not for search engines (#106); false in production
noindex = true

[project.theme]
language = "en"
custom_dir = "overrides"
features = ["navigation.instant", "search.highlight"]
# The blue V of vector.org.uk (#66)
favicon = "assets/images/favicon.png"
# The header logo: the BAA logogram, gold on blue, redrawn as SVG from a bitmap supplied by Stephen Taylor (2026-11-22)
logo = "assets/images/baa-logogram.svg"

# Only the extensions the converter's output needs. This replaces Zensical's
# defaults, several of which rewrite text that is common in articles about
# APL, J, K and q: smartsymbols (1/2 → ½, (r) → ®, -> → →), caret (^…^),
# tilde (~…~), mark (==…==), emoji (:name:), arithmatex ($…$), magiclink.
# Mathematics (#285) is typeset by arithmatex with MathJax, but only with the
# delimiters nothing in the archive uses: \(…\) inline and \begin{…}…\end{…}
# blocks; not $…$ (J, K, q and APL text) nor \[…\] (escaped brackets).
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
guess_lang = false
[project.markdown_extensions."pymdownx.tabbed"]
# issues as tabs on the volume pages; slugs make each tab linkable (#68)
alternate_style = true
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
[project.markdown_extensions."pymdownx.superfences"]
[project.markdown_extensions."pymdownx.arithmatex"]
generic = true
inline_syntax = ["round"]
block_syntax = ["begin"]
